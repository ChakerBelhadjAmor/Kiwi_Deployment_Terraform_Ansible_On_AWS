name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: validate bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  ansible:
    runs-on: ubuntu-latest
    env:
      # ansible.cfg points at files that only exist on the operator's laptop.
      ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.ci-vault-pass
      ANSIBLE_PRIVATE_KEY_FILE: ${{ github.workspace }}/.ci-no-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Throwaway vault (never committed)
        run: |
          echo ci > .ci-vault-pass
          cp ansible/group_vars/all/vault.yml.example ansible/group_vars/all/vault.yml
      - name: lint
        run: ansible-lint site.yml
        working-directory: ansible
      - name: syntax-check
        run: ansible-playbook site.yml --syntax-check -i localhost,
        working-directory: ansible

  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: importer/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: importer
      - run: pytest
        working-directory: importer

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          hide-progress: true
