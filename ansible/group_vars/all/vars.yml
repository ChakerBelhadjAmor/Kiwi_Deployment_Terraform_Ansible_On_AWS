---
# Non-secret settings. Secrets live in vault.yml (encrypted, gitignored).
swap_size_mb: 2048

# Kiwi publishes no versioned images on Docker Hub; the official registry only
# serves :latest. Record the pulled image digest in README after first deploy.
kiwi_image: pub.kiwitcms.eu/kiwitcms/kiwitcms
kiwi_image_tag: latest
mariadb_image_tag: "11.8"
caddy_image_tag: "2.11-alpine"

kiwi_dir: /opt/kiwi
kiwi_backup_dir: /var/backups/kiwi
kiwi_backup_keep_days: 7

# Production by default. For a first run use staging via: ansible-playbook site.yml -e caddy_acme_staging=true
caddy_acme_staging: false

# Off-VM backups. Set to the `backup_bucket_name` output of terraform/bootstrap
# (kiwi-backups-<account-id>) once the bucket and the instance role exist.
# Empty = local backups only.
kiwi_backup_bucket: ""
kiwi_aws_cli_image: amazon/aws-cli:2.27.0

# Docker volume names. Compose prefixes the project name (`kiwi`) to volumes
# without an explicit name, so `kiwi_uploads` becomes `kiwi_kiwi_uploads`.
kiwi_uploads_volume: kiwi_kiwi_uploads
kiwi_caddy_volume: kiwi_caddy_data

# Optional separate EBS disk for MariaDB (terraform output `data_volume_id`).
# Empty = data stays on the root disk. Migrate first: README "Separate data disk".
kiwi_data_volume_id: ""
kiwi_db_volume: kiwi_kiwi_db
kiwi_db_mountpoint: "/var/lib/docker/volumes/{{ kiwi_db_volume }}/_data"
