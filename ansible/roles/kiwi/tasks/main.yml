---
- name: Set up the optional data disk
  ansible.builtin.include_tasks: data_volume.yml
  when: kiwi_data_volume_id | length > 0

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ kiwi_backup_dir }}"
    state: directory
    mode: "0700"

- name: Install compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kiwi_dir }}/docker-compose.yml"
    mode: "0644"

- name: Install env files (secrets)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ kiwi_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: [db.env, web.env]
  no_log: true

- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ kiwi_dir }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
  register: kiwi_up

- name: Apply Kiwi database migrations
  ansible.builtin.command:
    cmd: docker compose exec -T web /Kiwi/manage.py migrate --noinput
    chdir: "{{ kiwi_dir }}"
  register: kiwi_migrate
  changed_when: "'Applying' in kiwi_migrate.stdout"

- name: Check Kiwi really uses MariaDB (not SQLite)
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T web /Kiwi/manage.py shell -c
      "from django.conf import settings as s; print(s.DATABASES['default']['ENGINE'])"
    chdir: "{{ kiwi_dir }}"
  register: kiwi_engine
  changed_when: false
  failed_when: "'mysql' not in kiwi_engine.stdout"

- name: Create the admin user if missing
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      # No value after -e: docker forwards the variable from the caller's
      # environment, so the password never appears in process arguments.
      - -e
      - KIWI_ADMIN_USER
      - -e
      - KIWI_ADMIN_EMAIL
      - -e
      - KIWI_ADMIN_PASSWORD
      - web
      - /Kiwi/manage.py
      - shell
      - -c
      - |
        import os
        from django.contrib.auth import get_user_model
        U = get_user_model()
        name = os.environ["KIWI_ADMIN_USER"]
        user = U.objects.filter(username=name).first()
        if user:
            if user.check_password(os.environ["KIWI_ADMIN_PASSWORD"]):
                print("exists")
            else:
                user.set_password(os.environ["KIWI_ADMIN_PASSWORD"])
                user.save()
                print("created: password updated")
        else:
            U.objects.create_superuser(name, os.environ["KIWI_ADMIN_EMAIL"], os.environ["KIWI_ADMIN_PASSWORD"])
            print("created")
    chdir: "{{ kiwi_dir }}"
  environment:
    KIWI_ADMIN_USER: "{{ vault_kiwi_admin_user }}"
    KIWI_ADMIN_EMAIL: "{{ vault_kiwi_admin_email }}"
    KIWI_ADMIN_PASSWORD: "{{ vault_kiwi_admin_password }}"
  register: kiwi_admin
  changed_when: "'created' in kiwi_admin.stdout"
  no_log: true

- name: Wait for Kiwi to answer through Caddy over HTTPS
  ansible.builtin.uri:
    url: "https://{{ vault_duckdns_subdomain }}.duckdns.org/accounts/login/"
    status_code: [200, 302]
  register: kiwi_http
  until: kiwi_http.status in [200, 302]
  retries: 30
  delay: 10
  changed_when: false
  no_log: true

- name: Set the Kiwi site domain
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - web
      - /Kiwi/manage.py
      - shell
      - -c
      - "from django.contrib.sites.models import Site; Site.objects.update(domain='{{ vault_duckdns_subdomain }}.duckdns.org', name='Kiwi TCMS')"
    chdir: "{{ kiwi_dir }}"
  changed_when: false
  no_log: true

- name: Install backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/sbin/kiwi-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Install restore script
  ansible.builtin.template:
    src: restore.sh.j2
    dest: /usr/local/sbin/kiwi-restore.sh
    owner: root
    group: root
    mode: "0750"

- name: Schedule the daily backup
  ansible.builtin.cron:
    name: kiwi database backup
    minute: "30"
    hour: "2"
    job: /usr/local/sbin/kiwi-backup.sh
    user: root
