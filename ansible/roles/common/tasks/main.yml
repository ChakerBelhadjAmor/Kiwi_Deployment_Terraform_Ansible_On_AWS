---
- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades, curl, dnsutils, ca-certificates]
    state: present

- name: Create swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M /swapfile"
    creates: /swapfile

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format swap file
  ansible.builtin.command:
    cmd: mkswap /swapfile
  register: common_mkswap
  changed_when: common_mkswap.rc == 0
  when: ansible_swaptotal_mb | int == 0

- name: Enable swap file
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: ansible_swaptotal_mb | int == 0
  changed_when: true

- name: Persist swap file in fstab
  ansible.posix.mount:
    src: /swapfile
    name: none
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present

- name: Enable automatic security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Allow SSH, HTTP and HTTPS through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]

- name: Default deny incoming and enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Harden sshd
  ansible.builtin.copy:
    # sshd keeps the FIRST value it reads and includes drop-ins in lexical order,
    # so this must sort before Ubuntu's 50-cloud-init.conf (PasswordAuthentication yes).
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Apply sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Read effective sshd settings
  ansible.builtin.command:
    cmd: sshd -T
  register: common_sshd_effective
  changed_when: false

- name: Assert password login and root login are really disabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in common_sshd_effective.stdout"
      - "'permitrootlogin no' in common_sshd_effective.stdout"
    fail_msg: sshd hardening is overridden by another config file
